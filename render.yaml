services:
  - type: web
    name: pcs-api
    runtime: python
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health/
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    disk:
      name: pcs-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pcs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pcs-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"

  - type: worker
    name: pcs-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: pcs-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: pcs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pcs-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: FRONTEND_URL
        fromService:
          name: pcs-api
          type: web
          envVarKey: FRONTEND_URL
      - key: EMAIL_BACKEND
        fromService:
          name: pcs-api
          type: web
          envVarKey: EMAIL_BACKEND
      - key: EMAIL_HOST
        fromService:
          name: pcs-api
          type: web
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        fromService:
          name: pcs-api
          type: web
          envVarKey: EMAIL_PORT
      - key: EMAIL_HOST_USER
        fromService:
          name: pcs-api
          type: web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          name: pcs-api
          type: web
          envVarKey: EMAIL_HOST_PASSWORD
      - key: EMAIL_USE_TLS
        fromService:
          name: pcs-api
          type: web
          envVarKey: EMAIL_USE_TLS
      - key: DEFAULT_FROM_EMAIL
        fromService:
          name: pcs-api
          type: web
          envVarKey: DEFAULT_FROM_EMAIL
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          name: pcs-api
          type: web
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_ACCESS_KEY_ID
        fromService:
          name: pcs-api
          type: web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          name: pcs-api
          type: web
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_S3_REGION_NAME
        fromService:
          name: pcs-api
          type: web
          envVarKey: AWS_S3_REGION_NAME
      - key: PYTHON_VERSION
        value: "3.12.3"

  - type: keyvalue
    name: pcs-redis
    plan: free
    ipAllowList: []

databases:
  - name: pcs-db
    plan: free
